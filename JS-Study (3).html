<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <style>
        h1{font-size: 50px;}
        .alert{
            height: 30px;
            width: 30px;
            border-radius: 50%;
            gap: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <button class="alert"></button>
    <button class="alert"></button>
    <button class="alert"></button>
    <h1></h1>

    <script>
        let buttons = document.querySelectorAll('button');
        buttons.forEach(button =>{
            button.addEventListener('click', ()=>{
                let message = document.querySelector('h1');
                message.textContent = 'You clicked a button'
            });
        });

    </script>
</body>
</html>
