<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <p id="id"></p>
<script>
    let carro = {
        marca:'Toyota',
        modelo: 'Corolla',
        ano:2022,
    }
    function mostrarResult(){
        document.getElementById("id").innerHTML =
        `Carro: ${carro.marca} ${carro.modelo}-${carro.ano}`
    } mostrarResult()
</script>
</body>
</html>
