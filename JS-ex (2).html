<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>ex-3</title>
<style>
    .inputStyle{
        background-color: rgb(255, 225, 92);
      color: rgb(0, 0, 0);
    }
    .inputStyle::placeholder{
        color: black;
    }
.button
{
    background-color: rgb(255, 225, 92);
      color: rgb(0, 0, 0);
}
.button:hover{
        background-color: rgb(0, 0, 0);
        color: aliceblue;
}
.box{
     display: flex;
  background: rgb(255, 249, 168);
  align-self:center;
  flex-direction: column;
}
</style>

</head>
<body>
<div class="box">
    <input class="inputStyle" id="numd" type="number" placeholder="Digite seu número: ">
    <button class="button" id="botaod">Verificar</button>
</div>
    <p id="resultd">Seu número é... </p>

<script>
    let num = document.getElementById("numd");
    let botao = document.getElementById("botaod");
    let result = document.getElementById("resultd");

botao.addEventListener("click", function(){
    let value = parseInt(num.value)
    
    if(value % 2 === 0){
        result.textContent = "Seu número é par"
    }
    else{
        result.textContent = "Seu número é ímpar"
    }
});
</script>

</body>
</html>
